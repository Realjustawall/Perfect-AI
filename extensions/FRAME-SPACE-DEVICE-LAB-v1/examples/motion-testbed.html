<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZT Motion Frame Testbed</title>
<style>*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#101010;color:#fafafa;font:500 17px/1.7 system-ui,sans-serif;overflow-x:hidden}header{position:fixed;inset:0 0 auto;z-index:4;padding:1rem 5vw;background:#111b;border-bottom:1px solid #ffffff40;backdrop-filter:blur(6px)}main{height:330vh;padding-top:85px}.stage{height:100vh;position:sticky;top:0;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:2.5rem;gap:3rem}article{max-width:32rem;z-index:2}h1{font-size:clamp(2rem,5vw,5rem);line-height:1.3;letter-spacing:-.04em;margin:0}p{max-width:44ch}.orb{width:min(35vw,340px);aspect-ratio:1;border:2px solid white;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 55px #ffffff1a;background:radial-gradient(ellipse at 60% 30%,#eee5,#222 70%);transform:translateY(calc(var(--zt-progress,0)*-100px)) rotate(calc(var(--zt-progress,0)*210deg));filter:contrast(1.15)}.orb::after{content:'3D SAFE AREA';font:600 clamp(10px,2vw,21px)/1 monospace;letter-spacing:2px}@media(max-width:650px){.stage{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:7vh 5vw;text-align:center;gap:1rem}.orb{width:min(65vw,280px)}article{max-width:100%}}@media(prefers-reduced-motion:reduce){.orb{transform:none!important;transition:none!important}} </style></head><body><header>Perfect_AI / Frame Inspector</header><main><div class="stage"><article data-testid="title" data-zt-source="examples/motion-testbed.html:article"><h1>حرکت دقیق، فریم به فریم</h1><p>هر حالت اسکرول باید قابل اندازه‌گیری، قابل بازگشت و به اندازهٔ صفحه سازگار باشد.</p></article><div class="orb" data-testid="orb"></div></div></main><script>
const root=document.documentElement;
function seek(p){const x=Math.max(0,Math.min(1,p));root.style.setProperty('--zt-progress',String(x));return x}
window.__ZT_MOTION_DEBUG__={seek,renderComplete:()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))),state:()=>({progress:Number(root.style.getPropertyValue('--zt-progress'))})};
let raf=0;function sync(){raf=0;seek(window.scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))}
window.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(sync)},{passive:true});sync();
</script></body></html>
