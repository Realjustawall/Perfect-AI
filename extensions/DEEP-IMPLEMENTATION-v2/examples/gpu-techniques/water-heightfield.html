<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Height Field</title><style>body{margin:0;background:#111;color:white;font-family:system-ui;padding:1rem}canvas{max-inline-size:100%;border:1px solid #555;touch-action:pan-y}button{padding:1rem;font:inherit}button:focus-visible{outline:3px solid white}</style><h1>شبیه‌سازی سطح آب — CPU fallback</h1><p>روی سطح کلیک کنید یا با کلید Enter موج بسازید. این نمونهٔ دوبعدیِ کم‌هزینه است و ادعای شبیه‌سازی سه‌بعدی Navier–Stokes ندارد.</p><canvas id="water" width="600" height="300" role="img" aria-label="نمایش موج سطح آب"></canvas><button id="pulse">ایجاد موج</button><button id="pause">توقف</button><script>
const canvas=document.getElementById('water'),c=canvas.getContext('2d');const W=120,H=60;let now=new Float32Array(W*H),prev=new Float32Array(W*H),next=new Float32Array(W*H),running=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function splash(x,y,r=5){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){let a=x+i,b=y+j;if(a>0&&a<W-1&&b>0&&b<H-1){let d=Math.hypot(i,j)/r;now[b*W+a]+=Math.max(0,1-d)*1.5;}}}
function step(){for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let n=y*W+x;next[n]=((now[n-1]+now[n+1]+now[n-W]+now[n+W])*.5-prev[n])*.987;}[prev,now,next]=[now,next,prev];}
function draw(){const img=c.createImageData(W,H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,s=Math.min(255,Math.max(0,128+now[i]*80));img.data[4*i]=s;img.data[4*i+1]=s;img.data[4*i+2]=s;img.data[4*i+3]=255}const off=document.createElement('canvas');off.width=W;off.height=H;off.getContext('2d').putImageData(img,0,0);c.imageSmoothingEnabled=true;c.drawImage(off,0,0,canvas.width,canvas.height)}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();splash(Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H));draw()});
document.getElementById('pulse').onclick=()=>{splash(60,30,10);draw()};document.getElementById('pause').onclick=e=>{running=!running;e.currentTarget.textContent=running?'توقف':'ادامه'};
function frame(){if(running){step();draw()}requestAnimationFrame(frame)}splash(60,30,12);frame();
</script></html>
