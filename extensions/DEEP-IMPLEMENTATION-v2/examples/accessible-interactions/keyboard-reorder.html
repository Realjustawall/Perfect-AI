<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessible Reorder</title><style>body{background:#111;color:#fff;padding:2rem;max-width:42rem;margin:auto;font:1rem/1.8 system-ui}li{display:flex;align-items:center;justify-content:space-between;padding:1rem;margin:.7rem 0;background:#242424;border:1px solid #777;border-radius:.6rem;gap:1rem}button{background:#fff;color:#000;border:0;padding:.6rem;min-width:44px;min-height:44px;cursor:pointer}button:focus-visible{outline:4px solid #fee487;outline-offset:3px}</style><h1>مرتب‌سازی سازگار با صفحه‌کلید</h1><p>با دکمه‌های بالا و پایین نیز می‌توانید ترتیب را عوض کنید. Drag فقط امکانات اضافه است، نه تنها راه تعامل.</p><ol id="items" aria-label="مرتب‌سازی قابلیت‌ها"></ol><p id="live" role="status" aria-live="polite"></p><script>
let items=['رنگ‌شناسی','ریسپانسیو','انیمیشن','سه‌بعدی'];const list=document.querySelector('#items'),live=document.querySelector('#live');
function move(i,dir){let j=i+dir;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render();list.querySelectorAll('li')[j].querySelector(dir===-1?'[data-up]':'[data-down]').focus();live.textContent=`${items[j]} منتقل شد به جایگاه ${j+1}`}
function render(){list.replaceChildren();items.forEach((name,i)=>{let li=document.createElement('li'),label=document.createElement('span');label.textContent=name;li.append(label);for(const [txt,dir,attr] of [['↑',-1,'up'],['↓',1,'down']]){let b=document.createElement('button');b.type='button';b.textContent=txt;b.setAttribute('data-'+attr,'');b.setAttribute('aria-label',`${name}: انتقال ${dir<0?'به بالا':'به پایین'}`);b.disabled=dir<0?i===0:i===items.length-1;b.onclick=()=>move(i,dir);li.append(b)}list.append(li)})}render();
</script></html>
