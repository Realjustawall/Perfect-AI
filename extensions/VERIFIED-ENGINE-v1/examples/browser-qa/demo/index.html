<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Perfect_AI Motion Verification Fixture</title>
<style>
:root{color-scheme:dark;--bg:#080808;--fg:#f7f7f7;font:16px/1.6 system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);overflow-x:clip}main{width:min(100% - 32px,1060px);margin:auto}header{min-height:100svh;display:grid;place-items:center;text-align:center}h1{font-size:clamp(2rem,7vw,6rem);line-height:1.1;max-width:18ch}section{min-height:95svh;display:grid;place-items:center;border-top:1px solid #444}.orb{--r:0;--p:0;width:min(45vmin,270px);aspect-ratio:1;border:2px solid white;border-radius:50%;box-shadow:inset 0 0 35px #999,0 0 22px #aaa3;transform:perspective(600px) rotateY(calc(var(--r)*1deg)) scale(calc(1 + var(--p)*.2));transition:transform .08s linear;will-change:transform}p{max-width:65ch}button{border:1px solid #ddd;background:transparent;color:inherit;padding:12px 18px;border-radius:8px;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:3px}body[dir=rtl]{font-family:Tahoma,sans-serif}@media(prefers-reduced-motion:reduce){.orb{transition:none;transform:none!important}}
</style></head><body><main><header><div><p>Perfect_AI / VERIFIED</p><h1>Animation evidence, not assumptions.</h1><button aria-label="Switch language" type="button">English / فارسی</button></div></header><section><div><div class="orb" role="img" aria-label="Abstract 3D motion fixture"></div><p id="status" aria-live="polite">Scroll and inspect the orb.</p></div></section><section><p>Always check return scrolling, reduced motion, text reflow and contrast.</p></section></main>
<script>
const orb=document.querySelector('.orb');const status=document.querySelector('#status');
function update(){let p=window.scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight);orb.style.setProperty('--p',p.toFixed(3));orb.style.setProperty('--r',String(Math.round(p*360)));status.textContent='Progress '+Math.round(p*100)+'%'}
let ticking=false;addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(()=>{update();ticking=false});ticking=true}},{passive:true});update();
document.querySelector('button').addEventListener('click',()=>{const fa=document.documentElement.lang!=='fa';document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.body.dir=fa?'rtl':'ltr';document.querySelector('h1').textContent=fa?'بازبینی دقیق انیمیشن و رابط کاربری':'Animation evidence, not assumptions.';});
</script></body></html>
