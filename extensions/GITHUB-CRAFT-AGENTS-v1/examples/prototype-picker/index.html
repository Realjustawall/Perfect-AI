<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfect AI — Divergent UI Prototypes</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d0e11;color:#f4f4f5}main{width:min(1120px,94%);margin:4rem auto}header{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}button{font:inherit;cursor:pointer}nav{display:flex;gap:.5rem;flex-wrap:wrap}nav button{border:1px solid #62646d;color:inherit;background:transparent;border-radius:9px;padding:.7rem 1rem}nav button[aria-pressed=true]{background:white;color:black}button:focus-visible{outline:3px solid #9eceff;outline-offset:2px}.stage{margin-top:2rem;min-height:360px;border:1px solid #33343c;border-radius:20px;overflow:hidden;transition:background .2s}.stage article{padding:clamp(1.5rem,4vw,4rem);min-height:360px;display:grid;gap:1rem;align-content:center}.stage h2{max-width:19ch;line-height:1.1;font-size:clamp(2.3rem,6vw,5rem);margin:.1rem 0}.stage p{max-width:55ch;line-height:1.6}.stage button{padding:.85rem 1.25rem;border:0;border-radius:9px}.editorial{background:#ecece2;color:#16151a;grid-template-columns:1fr .65fr;align-items:center}.editorial h2{font-family:Georgia,serif}.editorial button{background:#16151a;color:white}.utilitarian{background:#162831;color:white}.utilitarian h2{font-size:2.7rem;font-weight:650}.utilitarian button{background:#b6ff5c;color:#101410}.immersive{background:radial-gradient(circle at 80% 50%,#7846b0 0,transparent 40%),linear-gradient(135deg,#141326,#040408);color:white}.immersive button{background:#e8d3ff;color:#151020}.note{color:#b3b4bf;font-size:.9rem}footer{margin-top:1.5rem}@media(max-width:700px){.editorial{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.stage{transition:none}}
